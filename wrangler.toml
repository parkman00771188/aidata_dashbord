# Cloudflare Pages 설정
#
# 배포:
#   python build_static.py
#   npx wrangler pages deploy site --project-name publicdata-finder
#
# 로컬 미리보기:
#   npx wrangler pages dev site --kv SETTINGS
#
name = "publicdata-finder"
pages_build_output_dir = "site"
compatibility_date = "2026-01-01"

# AI 설정(키·on/off·모델)과 키워드 캐시 저장소
[[kv_namespaces]]
binding = "SETTINGS"
id = "f0575970a72f484eac85a8ae4a8d394b"
